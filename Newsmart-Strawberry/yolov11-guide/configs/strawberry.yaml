# ============================================================
# 番茄成熟度检测 — 数据集配置文件
# ============================================================
# 这是 YOLOv11 训练所需的 YAML 配置文件
# 你可以复制此文件，修改为自己的数据集

# 数据集根目录（绝对路径或相对于训练脚本的路径）
path: ./datasets/tomato

# 训练集、验证集、测试集的图片目录
train: images/train
val: images/val
test: images/test

# 类别数量
nc: 3

# 类别名称（顺序必须与标注文件中的 class_id 对应）
names:
  0: ripe        # 成熟
  1: half-ripe   # 半成熟
  2: unripe      # 未成熟
